schema_version: "1.1"
name: dynamic-plan-composer
expected_outcome: |
  Выбран динамический режим. plan.md написан по слайдам в формате
  «[N] заголовок · вид · мысль · needs: ... · motion: ... | static», план проверен
  рецензентом плана (или по запасному порядку без агентов), замечания внесены, работа
  остановлена до сборки. Процессы главы (установка пакета, выбор версий, автозагрузка
  класса) движутся, и в строке названо, что движется; определения и факты статичны;
  у функций и команд есть карточка до кода или схемы, где они используются.
context:
  scaffold_script: place-files.sh
